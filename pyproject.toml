[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-generation-boilerplate"
version = "0.1.0"
description = "Plan and run local FLUX image edits from a single Excel sheet"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl==3.1.5",
    "Pillow==13.0.0",
]

[project.optional-dependencies]
gpu = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "accelerate==1.13.0",
    "diffusers==0.38.0",
    "huggingface-hub==0.36.2",
    "numpy==2.5.4",
    "safetensors==0.9.0rc1",
    "transformers==4.57.6",
]

[project.scripts]
vgen = "vgen.cli:main"

[tool.setuptools]
packages = ["vgen"]
